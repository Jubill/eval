<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur d'évaluations — Technologie</title>
<style>
  :root{--c:#1A3F63;--c2:#2E75B6;--pale:#EBF4FB;--vert:#2E7D32;--rouge:#C0392B;--gris:#f4f6f8;}
  *{box-sizing:border-box;}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--gris);color:#1a1a1a;line-height:1.45;}
  .wrap{max-width:920px;margin:0 auto;padding:18px 16px 110px;}
  header{background:var(--c);color:#fff;border-radius:10px;padding:18px 22px;margin-bottom:16px;}
  header h1{margin:0;font-size:21px;}
  header p{margin:6px 0 0;font-size:13px;opacity:.88;}
  .card{background:#fff;border:1px solid #d8dde3;border-radius:10px;padding:16px 18px;margin-bottom:16px;}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--c);border-bottom:2px solid var(--pale);padding-bottom:8px;}
  label.f{display:block;font-weight:bold;font-size:13px;color:#444;margin:10px 0 4px;}
  input[type=text],input[type=number],textarea,select{width:100%;font-family:inherit;font-size:15px;padding:9px 11px;border:1.5px solid #ccc;border-radius:8px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c2);}
  textarea{min-height:54px;resize:vertical;}
  .grid{display:flex;gap:14px;flex-wrap:wrap;}
  .grid>div{flex:1;min-width:140px;}
  .themes{display:flex;gap:10px;flex-wrap:wrap;}
  .theme-btn{flex:1;min-width:130px;padding:12px;border-radius:10px;border:3px solid transparent;cursor:pointer;color:#fff;font-weight:bold;text-align:center;font-size:13px;}
  .theme-btn.sel{border-color:#111;box-shadow:0 0 0 2px #fff inset;}
  .qcard{border:1px solid #d8dde3;border-radius:10px;margin:14px 0;overflow:hidden;}
  .qcard-head{background:var(--pale);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .qcard-head .num{font-weight:bold;color:var(--c);font-size:15px;}
  .qcard-head .sp{flex:1;}
  .qcard-body{padding:12px 14px;}
  .opt-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .opt-row input[type=text]{flex:1;}
  .opt-row .mark{display:flex;align-items:center;gap:5px;font-size:12px;color:#555;white-space:nowrap;}
  .mini{font-size:13px;font-weight:bold;padding:7px 12px;border:none;border-radius:7px;cursor:pointer;}
  .mini.add{background:var(--pale);color:var(--c);}
  .mini.del{background:#FDECEA;color:var(--rouge);}
  .mini.mv{background:#eee;color:#555;}
  .imgprev{max-width:160px;max-height:110px;border:1px solid #ccc;border-radius:6px;display:block;margin:6px 0;}
  .bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--c);padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:10;}
  .bar button{font-family:inherit;font-size:14px;font-weight:bold;padding:11px 18px;border:none;border-radius:8px;cursor:pointer;}
  .b-add{background:var(--c2);color:#fff;} .b-eleve{background:var(--vert);color:#fff;}
  .b-corr{background:#6A4C93;color:#fff;} .b-save{background:#555;color:#fff;}
  .b-load{background:#eee;color:#444;border:1px solid #ccc;}
  .hint{font-size:12px;color:#777;font-style:italic;margin-top:4px;}
  .tag{display:inline-block;background:var(--pale);color:var(--c);font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛠 Générateur d'évaluations — Technologie cycle 4</h1>
    <p>Compose ton évaluation (questions, schémas, réponses) puis exporte la page élève auto-notée avec QR code, et le corrigé prof. Tout fonctionne hors connexion.</p>
  </header>

  <div class="card">
    <h2>1. Réglages de l'évaluation</h2>
    <label class="f">Niveau / thème de couleur</label>
    <div class="themes" id="themes"></div>
    <div class="grid" style="margin-top:12px;">
      <div>
        <label class="f">Titre de l'évaluation</label>
        <input type="text" id="titre" placeholder="Évaluation — Réseaux & cybersécurité">
      </div>
    </div>
    <div class="grid">
      <div>
        <label class="f">Sous-titre / repère (séquence, semaine…)</label>
        <input type="text" id="meta" placeholder="Séquence 5 · Semaine 25">
      </div>
      <div>
        <label class="f">Durée affichée</label>
        <input type="text" id="duree" placeholder="30 min">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. Questions <span class="tag" id="qcount">0 question</span> <span class="tag" id="ptcount">0 point</span></h2>
    <div id="questions"></div>
    <button class="mini add" style="margin-top:10px;font-size:14px;padding:10px 16px;" onclick="addQuestion()">➕ Ajouter une question</button>
  </div>
</div>

<div class="bar">
  <button class="b-add" onclick="addQuestion()">➕ Question</button>
  <button class="b-eleve" onclick="exportEleve()">⬇ Exporter la page élève (QR)</button>
  <button class="b-corr" onclick="exportCorrige()">⬇ Exporter le corrigé prof</button>
  <button class="b-save" onclick="saveProject()">💾 Enregistrer le projet</button>
  <button class="b-load" onclick="document.getElementById('loadin').click()">📂 Charger un projet</button>
  <input type="file" id="loadin" accept=".json" style="display:none" onchange="loadProject(this.files[0])">
</div>

<script type="text/plain" id="studentengine">var SALT="TECHNO-C4-2024-bo9";
function H(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h.toString(36);}
var quizEl=document.getElementById('quiz');
function render(){
  quizEl.innerHTML='';
  QUESTIONS.forEach(function(it,i){
    var card=document.createElement('div');card.className='q';card.id='q'+i;
    var body='';
    if(it.img){ body+='<img class="qimg" src="'+it.img+'" alt="schéma question '+(i+1)+'">'; }
    if(it.type==='num'){
      body+='<input type="number" step="any" class="num-input" id="inp'+i+'" placeholder="?"> <span class="num-unit">'+(it.unit||'')+'</span>';
    }else{
      var inputType=(it.type==='multi')?'checkbox':'radio';
      body+=it.opts.map(function(o,j){
        return '<label class="opt" id="opt'+i+'_'+j+'"><input type="'+inputType+'" name="q'+i+'" value="'+j+'"> '+o+'</label>';
      }).join('');
    }
    card.innerHTML='<div class="q-head"><span>'+(i+1)+'. '+it.q+'</span><span class="pts">'+it.pts+' pts</span></div><div class="q-body">'+body+'</div>';
    quizEl.appendChild(card);
  });
}
function corriger(){
  var nom=(document.getElementById('nom').value||'').trim();
  var classe=(document.getElementById('classe').value||'').trim();
  if(!nom){alert('Saisis ton NOM et ton prénom avant de valider.');return;}
  var total=0,max=0;
  QUESTIONS.forEach(function(it,i){
    max+=it.pts;
    if(it.type==='num'){
      var raw=(document.getElementById('inp'+i).value||'').replace(',','.');
      var v=parseFloat(raw);var rep=isNaN(v)?'#':String(v);
      if(H(SALT+'|'+i+'|'+rep)===it.h)total+=it.pts;
    }else if(it.type==='multi'){
      var arr=[].slice.call(document.querySelectorAll('input[name="q'+i+'"]:checked')).map(function(e){return parseInt(e.value);}).sort(function(a,b){return a-b;});
      if(H(SALT+'|'+i+'|'+arr.join(','))===it.h)total+=it.pts;
    }else{
      var sel=document.querySelector('input[name="q'+i+'"]:checked');
      var ch=sel?sel.value:'#';
      if(H(SALT+'|'+i+'|'+ch)===it.h)total+=it.pts;
    }
  });
  var payload={n:nom,c:classe,e:EVAL_ID,s:total,m:max};
  payload.k=H(JSON.stringify(payload)+SALT);
  var code=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  var res=document.getElementById('result');var pct=total/max;var bg,col;
  if(pct>=0.8){bg='#E8F5E9';col='#1b5e20';}else if(pct>=0.5){bg='#FFF8E1';col='#7F5400';}else{bg='#FDECEA';col='#7b241c';}
  document.getElementById('top').style.background=bg;document.getElementById('top').style.color=col;
  document.getElementById('top').innerHTML='Note enregistr\u00e9e<span class="note">'+total+' / '+max+'</span>'+nom+(classe?(' \u2014 '+classe):'');
  document.getElementById('codeval').textContent=code;
  try{var qr=qrcode(0,'M');qr.addData(code);qr.make();document.getElementById('qrbox').innerHTML=qr.createImgTag(5,10);}catch(e){document.getElementById('qrbox').innerHTML='';}
  var d=new Date();function z(n){return (n<10?'0':'')+n;}
  document.getElementById('pdate').textContent='Copie valid\u00e9e le '+z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' \u00e0 '+z(d.getHours())+'h'+z(d.getMinutes());
  verrouiller(true);
  res.className='result shown';res.scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('btnval').disabled=true;
}
function verrouiller(on){
  quizEl.classList.toggle('locked',on);
  [].forEach.call(document.querySelectorAll('#quiz input, .ident input'),function(inp){
    if(inp.type==='text'||inp.type==='number'){inp.readOnly=on;}
    inp.tabIndex=on?-1:0;
    if(on&&(inp.type==='radio'||inp.type==='checkbox')&&inp.checked){inp.parentNode.classList.add('picked');}
  });
  QUESTIONS.forEach(function(it,i){
    var card=document.getElementById('q'+i);if(!card)return;
    var vide=it.type==='num'?!document.getElementById('inp'+i).value:!card.querySelector('input:checked');
    card.classList.toggle('noanswer',on&&vide);
  });
}
quizEl.addEventListener('click',function(e){if(quizEl.classList.contains('locked')){e.preventDefault();}},true);
function imprimer(){window.print();}
function copier(){var t=document.getElementById('codeval').textContent;navigator.clipboard&&navigator.clipboard.writeText(t);var b=document.getElementById('btncopy');b.textContent='\u2713 Code copi\u00e9 !';setTimeout(function(){b.textContent='\u2398 Copier le code';},1800);}
function recommencer(){render();verrouiller(false);document.getElementById('result').className='result';document.getElementById('btnval').disabled=false;window.scrollTo({top:0,behavior:'smooth'});}
render();
</script>
<script type="text/plain" id="studentcss">*{box-sizing:border-box;}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--xpale);color:#1a1a1a;line-height:1.5;}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 70px;}
header{background:var(--fonce);color:#fff;border-radius:10px 10px 0 0;padding:18px 22px;}
header .niveau{font-size:13px;letter-spacing:.5px;opacity:.85;text-transform:uppercase;}
header h1{margin:6px 0 0;font-size:20px;}
.sub{background:var(--c);color:#fff;padding:10px 22px;font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ident{background:#fff;border:1px solid #ccc;border-top:none;padding:14px 22px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px;}
.ident label{font-weight:bold;color:var(--fonce);}
.ident input{border:none;border-bottom:1.5px dotted #ccc;font-size:14px;padding:4px 6px;min-width:120px;font-family:inherit;}
.ident input:focus{outline:none;border-bottom-color:var(--c);}
.consigne{background:#f5f5f5;border:1px solid #ccc;border-top:none;padding:12px 22px;font-size:13px;color:#4a4a4a;font-style:italic;}
.q{background:#fff;border:1px solid #ccc;border-radius:8px;margin:16px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.q-head{background:var(--pale);padding:11px 16px;font-weight:bold;color:var(--fonce);display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-left:5px solid var(--c);}
.q-head .pts{font-size:13px;white-space:nowrap;}
.q-body{padding:12px 18px 16px;}
.qimg{display:block;max-width:100%;max-height:320px;margin:4px auto 14px;border:1px solid #ddd;border-radius:8px;}
.opt{display:block;padding:9px 12px;margin:6px 0;border:1px solid #ccc;border-radius:6px;cursor:pointer;transition:.15s;font-size:15px;}
.opt:hover{background:var(--xpale);border-color:var(--c);}
.opt input{margin-right:10px;transform:scale(1.2);}
.num-input{font-size:16px;padding:8px 12px;border:1.5px solid #ccc;border-radius:6px;width:140px;font-family:inherit;}
.num-input:focus{outline:none;border-color:var(--c);}
.num-unit{margin-left:8px;color:#4a4a4a;font-size:14px;}
.bar{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--c);padding:14px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;box-shadow:0 -2px 8px rgba(0,0,0,.08);}
button{font-family:inherit;font-size:15px;font-weight:bold;padding:11px 26px;border:none;border-radius:7px;cursor:pointer;}
.btn-corr{background:var(--c);color:#fff;}
.btn-reset{background:#f5f5f5;color:#4a4a4a;border:1px solid #ccc;}
.result{display:none;margin:16px 0;border-radius:10px;overflow:hidden;border:1px solid #ccc;}
.result.shown{display:block;}
.result .top{text-align:center;font-size:24px;font-weight:bold;padding:20px;}
.result .note{font-size:42px;display:block;margin:4px 0;}
.result .codebox{background:var(--xpale);padding:16px 20px;border-top:1px solid #ccc;}
.result .codebox p{margin:0 0 8px;font-size:14px;color:#4a4a4a;}
.qrwrap{text-align:center;background:#fff;border:1px solid #ccc;border-radius:8px;padding:14px;margin:0 0 12px;}
.qrwrap img{image-rendering:pixelated;width:200px;height:200px;}
.qrlabel{font-size:13px;color:#555;margin:8px 0 0 !important;font-style:italic;}
.code{font-family:monospace;font-size:15px;background:#fff;border:1.5px solid var(--c);border-radius:6px;padding:12px;word-break:break-all;color:var(--fonce);font-weight:bold;}
.btn-copy{margin-top:10px;background:var(--c);color:#fff;font-size:14px;padding:9px 18px;}
.warn{color:#7b241c;font-size:13px;margin-top:8px;}
footer{text-align:center;font-size:12px;color:#4a4a4a;padding:20px;}
.btn-print{display:block;width:100%;margin:0;border-radius:0;background:var(--fonce);color:#fff;font-size:16px;padding:14px;}
.pdate{text-align:center;font-size:13px;color:#4a4a4a;padding:0 20px 12px;}
.locked .opt{cursor:default;}
.locked .opt:hover{background:#fff;border-color:#ccc;}
.opt.picked,.locked .opt.picked:hover{border:2px solid var(--c);background:var(--pale);font-weight:bold;}
.noanswer .q-head .pts::before{content:"Sans réponse · ";font-weight:normal;font-style:italic;color:#7b241c;}
.print-only{display:none;}
@page{size:A4 portrait;margin:12mm 12mm 14mm;}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{background:#fff;font-size:10.5pt;line-height:1.35;}
  .wrap{max-width:none;padding:0;}
  .bar,.btn-copy,.btn-print,.warn,.consigne,footer,.qrlabel{display:none !important;}
  .print-only{display:block;}
  header{padding:10px 14px;border-radius:0;}
  header h1{font-size:15pt;}
  .sub{padding:6px 14px;font-size:9.5pt;}
  .ident{padding:8px 14px;font-size:10.5pt;}
  .ident input{border-bottom:none;font-weight:bold;font-size:11pt;color:#000;}
  .ident input::placeholder{color:transparent;}
  .q{box-shadow:none;margin:8px 0;border-radius:4px;break-inside:avoid;page-break-inside:avoid;}
  .q-head{padding:6px 12px;}
  .q-body{padding:6px 12px 8px;}
  .qimg{max-height:200px;margin:2px auto 8px;}
  .opt{padding:4px 10px;margin:3px 0;font-size:10.5pt;color:#555;}
  .opt.picked{color:#000;}
  .opt input{transform:none;}
  .num-input{border:1.5px solid #555;font-weight:bold;color:#000;padding:4px 8px;font-size:11pt;}
  .num-input::placeholder{color:transparent;}
  .result{break-inside:avoid;page-break-inside:avoid;margin:12px 0 0;border-radius:4px;display:flex !important;align-items:stretch;}
  .result:not(.shown){display:none !important;}
  .result .toparea{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .result .top{font-size:13pt;padding:10px;flex:1;display:flex;flex-direction:column;justify-content:center;}
  .result .note{font-size:24pt;}
  .result .codebox{border-top:none;border-left:1px solid #ccc;padding:10px;width:62mm;flex:none;}
  .result .codebox>p:first-child{display:none;}
  .qrwrap{padding:4px;margin:0 0 6px;border:none;}
  .qrwrap img{width:36mm;height:36mm;}
  .code{font-size:7pt;padding:4px;font-weight:normal;border-width:1px;}
  .signature{margin-top:10px;display:flex;gap:12px;font-size:9.5pt;break-inside:avoid;}
  .signature div{flex:1;border:1px solid #999;border-radius:4px;padding:6px 10px;min-height:22mm;color:#4a4a4a;}
}
</script>

<script>
// ───────── Thèmes ─────────
var THEMES = {
  "5e":{label:"5ème · Habitat & Mobilier",c:"#2E75B6",fonce:"#1A3F63",pale:"#D6E8F6",xpale:"#EBF4FB"},
  "4e":{label:"4ème · Systèmes & Robotique",c:"#2E7D32",fonce:"#1C3D1C",pale:"#DCEDC8",xpale:"#F1F8E9"},
  "3e":{label:"3ème · Communication & Design",c:"#D4500A",fonce:"#7F3100",pale:"#FFE0CC",xpale:"#FFF3EC"}
};
var SALT="TECHNO-C4-2024-bo9";
function H(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h.toString(36);}

var state = { niveau:"5e", questions:[] };

// ───────── Rendu des thèmes ─────────
function renderThemes(){
  var box=document.getElementById('themes');box.innerHTML='';
  Object.keys(THEMES).forEach(function(k){
    var t=THEMES[k];var b=document.createElement('div');
    b.className='theme-btn'+(state.niveau===k?' sel':'');
    b.style.background=t.fonce;b.textContent=t.label;
    b.onclick=function(){ sync(); state.niveau=k; renderThemes(); };
    box.appendChild(b);
  });
}

// ───────── Modèle question ─────────
function newQuestion(){ return {type:"qcm",q:"",pts:2,img:"",opts:[{txt:"",correct:true},{txt:"",correct:false}],unit:"",tol:0,fb:""}; }

function addQuestion(){ sync(); state.questions.push(newQuestion()); renderQuestions(); }
function delQuestion(i){ sync(); state.questions.splice(i,1); renderQuestions(); }
function moveQuestion(i,d){ sync(); var j=i+d; if(j<0||j>=state.questions.length)return; var tmp=state.questions[i];state.questions[i]=state.questions[j];state.questions[j]=tmp; renderQuestions(); }
function changeType(i,v){ sync(); var q=state.questions[i]; q.type=v;
  if(v==='vf'){ q.opts=[{txt:"Vrai",correct:true},{txt:"Faux",correct:false}]; }
  else if((v==='qcm'||v==='multi')&&(!q.opts||q.opts.length<2)){ q.opts=[{txt:"",correct:true},{txt:"",correct:false}]; }
  renderQuestions();
}
function addOption(i){ sync(); state.questions[i].opts.push({txt:"",correct:false}); renderQuestions(); }
function delOption(i,j){ sync(); var q=state.questions[i]; if(q.opts.length<=2)return; q.opts.splice(j,1);
  if(q.type!=='multi' && !q.opts.some(function(o){return o.correct;})) q.opts[0].correct=true; renderQuestions(); }

function setImage(i,file){
  if(!file){ return; }
  var rd=new FileReader();
  rd.onload=function(){ sync(); state.questions[i].img=rd.result; renderQuestions(); };
  rd.readAsDataURL(file);
}
function delImage(i){ sync(); state.questions[i].img=""; renderQuestions(); }

// ───────── Lire le DOM vers le modèle (avant toute opération structurelle) ─────────
function sync(){
  state.questions.forEach(function(q,i){
    var card=document.getElementById('qc'+i); if(!card)return;
    q.q=card.querySelector('.q-enonce').value;
    q.pts=parseFloat(card.querySelector('.q-pts').value)||0;
    q.fb=card.querySelector('.q-fb').value;
    if(q.type==='num'){
      q.unit=card.querySelector('.q-unit').value;
      var nv=card.querySelector('.q-numval').value.replace(',','.');
      q.numval=nv;
      q.tol=parseFloat(card.querySelector('.q-tol').value)||0;
    }else{
      var rows=card.querySelectorAll('.opt-row');
      q.opts=[];
      rows.forEach(function(r){
        var txt=r.querySelector('.o-txt').value;
        var mark=r.querySelector('.o-mark');
        q.opts.push({txt:txt,correct:mark.checked});
      });
    }
  });
}

// ───────── Rendu des questions ─────────
function renderQuestions(){
  renderThemes();
  var box=document.getElementById('questions');box.innerHTML='';
  state.questions.forEach(function(q,i){
    var card=document.createElement('div');card.className='qcard';card.id='qc'+i;
    var typeSel='<select class="q-type" onchange="changeType('+i+',this.value)">'+
      ['qcm:QCM (1 bonne réponse)','multi:QCM (plusieurs réponses)','vf:Vrai / Faux','num:Réponse numérique']
      .map(function(o){var p=o.split(':');return '<option value="'+p[0]+'"'+(q.type===p[0]?' selected':'')+'>'+p[1]+'</option>';}).join('')+'</select>';

    var ansHtml='';
    if(q.type==='num'){
      ansHtml='<div class="grid">'+
        '<div><label class="f">Bonne réponse (nombre)</label><input type="text" class="q-numval" value="'+(q.numval!=null?q.numval:'')+'" placeholder="2000"></div>'+
        '<div><label class="f">Unité (affichée)</label><input type="text" class="q-unit" value="'+(q.unit||'')+'" placeholder="Ko"></div>'+
        '<div><label class="f">Tolérance (±)</label><input type="number" class="q-tol" value="'+(q.tol||0)+'" step="any"></div>'+
        '</div><div class="hint">La réponse est juste si |saisie − bonne réponse| ≤ tolérance. Mets 0 pour exiger la valeur exacte.</div>';
    }else{
      var inputType=(q.type==='multi')?'checkbox':'radio';
      var rows=q.opts.map(function(o,j){
        return '<div class="opt-row">'+
          '<span class="mark"><input type="'+inputType+'" class="o-mark" name="correct'+i+'" '+(o.correct?'checked':'')+'> juste</span>'+
          '<input type="text" class="o-txt" value="'+(o.txt||'').replace(/"/g,'&quot;')+'" placeholder="Proposition '+(j+1)+'">'+
          (q.type!=='vf'?'<button class="mini del" onclick="delOption('+i+','+j+')">✕</button>':'')+
          '</div>';
      }).join('');
      ansHtml='<label class="f">Réponses '+(q.type==='multi'?'(coche toutes les bonnes)':'(coche la bonne)')+'</label>'+rows+
        (q.type!=='vf'?'<button class="mini add" onclick="addOption('+i+')">➕ proposition</button>':'');
    }

    var imgHtml = q.img
      ? '<img class="imgprev" src="'+q.img+'"><button class="mini del" onclick="delImage('+i+')">Retirer le schéma</button>'
      : '<input type="file" accept="image/*" onchange="setImage('+i+',this.files[0])"><div class="hint">Optionnel : ajoute un schéma / une photo à la question.</div>';

    card.innerHTML=
      '<div class="qcard-head"><span class="num">Question '+(i+1)+'</span>'+typeSel+'<span class="sp"></span>'+
        '<button class="mini mv" onclick="moveQuestion('+i+',-1)">▲</button>'+
        '<button class="mini mv" onclick="moveQuestion('+i+',1)">▼</button>'+
        '<button class="mini del" onclick="delQuestion('+i+')">🗑 Supprimer</button></div>'+
      '<div class="qcard-body">'+
        '<label class="f">Énoncé</label><textarea class="q-enonce" placeholder="Pose ta question…">'+(q.q||'')+'</textarea>'+
        '<div class="grid"><div style="max-width:120px;"><label class="f">Points</label><input type="number" class="q-pts" value="'+(q.pts!=null?q.pts:2)+'" step="0.5" min="0"></div>'+
          '<div><label class="f">Schéma (image)</label>'+imgHtml+'</div></div>'+
        ansHtml+
        '<label class="f">Explication (corrigé prof, optionnel)</label><textarea class="q-fb" placeholder="Explication affichée dans le corrigé…">'+(q.fb||'')+'</textarea>'+
      '</div>';
    box.appendChild(card);
  });
  updateCounts();
}
function updateCounts(){
  var n=state.questions.length;
  var pts=state.questions.reduce(function(s,q){return s+(parseFloat(q.pts)||0);},0);
  document.getElementById('qcount').textContent=n+' question'+(n>1?'s':'');
  document.getElementById('ptcount').textContent=pts+' point'+(pts>1?'s':'');
}

// ───────── Helpers export ─────────
function slug(s){ return (s||'evaluation').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||'evaluation'; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function validate(){
  sync();
  if(!state.questions.length){ alert('Ajoute au moins une question.'); return false; }
  for(var i=0;i<state.questions.length;i++){
    var q=state.questions[i];
    if(!q.q.trim()){ alert('Question '+(i+1)+' : énoncé vide.'); return false; }
    if(q.type==='num'){
      if(q.numval===''||isNaN(parseFloat(q.numval))){ alert('Question '+(i+1)+' : indique la bonne réponse numérique.'); return false; }
    }else{
      if(q.opts.some(function(o){return !o.txt.trim();})){ alert('Question '+(i+1)+' : une proposition est vide.'); return false; }
      if(!q.opts.some(function(o){return o.correct;})){ alert('Question '+(i+1)+' : coche au moins une bonne réponse.'); return false; }
    }
  }
  return true;
}

function buildStripped(){
  return state.questions.map(function(q,i){
    var o={type:(q.type==='vf'?'qcm':q.type),pts:parseFloat(q.pts)||0,q:esc(q.q)};
    if(q.img)o.img=q.img;
    if(q.type==='num'){
      o.unit=q.unit||''; o.h=H(SALT+'|'+i+'|'+String(parseFloat(q.numval)));
    }else if(q.type==='multi'){
      o.opts=q.opts.map(function(x){return esc(x.txt);});
      var idx=q.opts.map(function(x,j){return x.correct?j:-1;}).filter(function(x){return x>=0;}).sort(function(a,b){return a-b;});
      o.h=H(SALT+'|'+i+'|'+idx.join(','));
    }else{ // qcm / vf
      o.opts=q.opts.map(function(x){return esc(x.txt);});
      var ci=q.opts.findIndex(function(x){return x.correct;});
      o.h=H(SALT+'|'+i+'|'+ci);
    }
    return o;
  });
}

function download(name,content,type){
  var blob=new Blob([content],{type:(type||'text/html')+';charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}

// ───────── Export page élève ─────────
function exportEleve(){
  if(!validate())return;
  var t=THEMES[state.niveau];
  var titre=esc(document.getElementById('titre').value||'Évaluation');
  var meta=esc(document.getElementById('meta').value||'');
  var duree=esc(document.getElementById('duree').value||'30 min');
  var stripped=buildStripped();
  var total=stripped.reduce(function(s,q){return s+q.pts;},0);
  var evalId=slug(document.getElementById('titre').value);
  var qrlib=atob(document.getElementById('qrlib').textContent.trim());
  var engine=document.getElementById('studentengine').textContent;
  var css=document.getElementById('studentcss').textContent;

  var html='<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="UTF-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>'+titre+'</title>\n<style>\n'+
    ':root{--c:'+t.c+';--fonce:'+t.fonce+';--pale:'+t.pale+';--xpale:'+t.xpale+';}\n'+css+'\n</style>\n</head>\n<body>\n<div class="wrap">\n'+
    '<header><div class="niveau">Technologie — '+esc(t.label)+'</div><h1>'+titre+'</h1></header>\n'+
    '<div class="sub"><span>'+meta+'</span><span>Durée : '+duree+'</span><span><strong>Total : / '+total+' points</strong></span></div>\n'+
    '<div class="ident"><span><label>NOM Prénom :</label> <input type="text" id="nom" placeholder="DUPONT Léa"></span>'+
    '<span><label>Classe :</label> <input type="text" id="classe" placeholder="classe…"></span></div>\n'+
    '<div class="consigne">Réponds à toutes les questions puis clique sur « Valider ». Ta note et un code-résultat (avec QR code) s\u2019affichent : montre-les au professeur. Tu peux ensuite imprimer ta copie pour la coller dans ton cahier. Les bonnes réponses ne sont pas affichées.</div>\n'+
    '<div id="quiz"></div>\n'+
    '<div class="result" id="result"><div class="toparea"><div class="top" id="top"></div><div class="pdate" id="pdate"></div>'+
    '<button class="btn-print" onclick="imprimer()">\ud83d\udda8 Imprimer ma copie (A4)</button></div>'+
    '<div class="codebox"><p><strong>Ton code-résultat</strong> (à montrer ou envoyer au professeur) :</p>'+
    '<div class="qrwrap"><div id="qrbox"></div><p class="qrlabel">\u2191 Le professeur scanne ce QR code</p></div>'+
    '<div class="code" id="codeval"></div><button class="btn-copy" id="btncopy" onclick="copier()">\u2398 Copier le code</button>'+
    '<div class="warn">Ce code contient ton nom et ta note. Ne le modifie pas : toute modification est détectée.</div></div></div>\n'+
    '<div class="signature print-only"><div>Observations du professeur :</div><div>Signature des responsables légaux :</div></div>\n'+
    '<div class="bar"><button class="btn-corr" id="btnval" onclick="corriger()">\u2713 Valider mon évaluation</button>'+
    '<button class="btn-reset" onclick="recommencer()">\u21ba Recommencer</button></div>\n'+
    '<footer>Évaluation auto-notée · Sans corrigé élève · QR code · Copie imprimable · Hors connexion</footer>\n</div>\n'+
    '<scr'+'ipt>\n'+qrlib+'\nvar EVAL_ID='+JSON.stringify(evalId)+';\nvar QUESTIONS='+JSON.stringify(stripped)+';\n'+engine+'\n<\/scr'+'ipt>\n</body>\n</html>';

  download('eval_'+evalId+'_eleve.html', html);
}

// ───────── Export corrigé prof ─────────
function exportCorrige(){
  if(!validate())return;
  var t=THEMES[state.niveau];
  var titre=esc(document.getElementById('titre').value||'Évaluation');
  var meta=esc(document.getElementById('meta').value||'');
  var total=state.questions.reduce(function(s,q){return s+(parseFloat(q.pts)||0);},0);
  function L(n){return String.fromCharCode(65+n);}
  var body='';
  state.questions.forEach(function(q,i){
    var rep='';
    if(q.type==='num'){ rep='<strong>'+esc(q.numval)+'</strong> '+esc(q.unit||'')+(q.tol?(' (± '+q.tol+')'):''); }
    else if(q.type==='multi'){ rep=q.opts.map(function(o,j){return o.correct?('<strong>'+L(j)+'.</strong> '+esc(o.txt)):null;}).filter(Boolean).join('  +  '); }
    else { var ci=q.opts.findIndex(function(o){return o.correct;}); rep='<strong>'+L(ci)+'.</strong> '+esc(q.opts[ci].txt); }
    var optList = (q.type==='num')?'' : '<div style="margin:4px 0;color:#555;font-size:14px;">'+q.opts.map(function(o,j){return L(j)+'. '+esc(o.txt);}).join(' · ')+'</div>';
    body+='<div style="padding:10px 0;border-bottom:1px solid #eee;">'+
      '<div style="font-weight:bold;">'+(i+1)+'. '+esc(q.q)+' <span style="color:#999;font-weight:normal;">('+(parseFloat(q.pts)||0)+' pts)</span></div>'+
      (q.img?'<img src="'+q.img+'" style="max-width:280px;max-height:180px;border:1px solid #ddd;border-radius:6px;margin:6px 0;">':'')+
      optList+
      '<div style="margin-top:4px;color:'+t.fonce+';">\u2714 Réponse : '+rep+'</div>'+
      (q.fb?'<div style="margin-top:2px;color:#555;font-style:italic;font-size:14px;">'+esc(q.fb)+'</div>':'')+'</div>';
  });
  var html='<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">'+
    '<title>Corrigé — '+titre+'</title><style>body{font-family:Arial,sans-serif;max-width:860px;margin:0 auto;padding:22px;color:#1a1a1a;}'+
    'h1{font-size:21px;border-bottom:3px solid '+t.fonce+';padding-bottom:8px;color:'+t.fonce+';}'+
    '.intro{background:#FFF8E1;border-left:5px solid #F9A825;padding:12px 16px;border-radius:6px;font-size:14px;margin:14px 0;}</style></head><body>'+
    '<h1>\u2714 Corrigé — '+titre+'</h1><div class="intro"><strong>Document réservé au professeur.</strong> '+meta+' · Total : /'+total+
    '. Les lettres (A, B, C…) correspondent à l\u2019ordre des propositions affichées aux élèves.</div>'+body+'</body></html>';
  download('corrige_'+slug(document.getElementById('titre').value)+'.html', html);
}

// ───────── Enregistrer / charger projet ─────────
function saveProject(){
  sync();
  var proj={niveau:state.niveau,titre:document.getElementById('titre').value,meta:document.getElementById('meta').value,duree:document.getElementById('duree').value,questions:state.questions};
  download(slug(document.getElementById('titre').value)+'_projet.json', JSON.stringify(proj,null,2), 'application/json');
}
function loadProject(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var p=JSON.parse(rd.result);
      state.niveau=p.niveau||'5e'; state.questions=p.questions||[];
      document.getElementById('titre').value=p.titre||'';
      document.getElementById('meta').value=p.meta||'';
      document.getElementById('duree').value=p.duree||'';
      renderQuestions();
    }catch(e){ alert('Fichier projet illisible.'); }
  };
  rd.readAsText(file);
}

// ───────── Init ─────────
document.getElementById('duree').value='30 min';
addQuestion();
renderThemes();
</script>
</body>
